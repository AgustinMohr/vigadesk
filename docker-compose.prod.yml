# Overlay de producción. Uso:
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d
#   docker compose --env-file .env -f docker-compose.frontend.yml up -d
#
# Reglas:
#  - Ningún puerto de DB, broker, microservicio, Eureka ni observabilidad se publica al host.
#  - Los secretos son obligatorios: `${VAR:?mensaje}` falla si no está definido.
#  - Los perfiles Spring (application-prod.yml) se agregan en Fase 5; hasta entonces
#    los servicios usan application.properties + las variables de entorno de este overlay.

services:
  rabbitmq:
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME es obligatorio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD es obligatorio}

  mysql:
    ports: !reset []
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD es obligatorio}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE es obligatorio}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER es obligatorio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD es obligatorio}
    healthcheck:
      test: !override
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent

  pg-dan:
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatorio}

  mongo-db:
    ports: !reset []
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME es obligatorio}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD es obligatorio}

  ms-eureka:
    ports: !reset []

  ms-clientes:
    ports: !reset []
    environment:
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?MYSQL_USER es obligatorio}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD es obligatorio}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME es obligatorio}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD es obligatorio}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}

  ms-productos:
    ports: !reset []
    environment:
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME es obligatorio}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD es obligatorio}

  ms-pedidos:
    ports: !reset []
    environment:
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME es obligatorio}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD es obligatorio}
      SPRING_DATA_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME es obligatorio}:${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD es obligatorio}@mongo-db:27017/pedidosdb?authSource=admin
      CORRALON_NOMBRE: ${CORRALON_NOMBRE:?CORRALON_NOMBRE es obligatorio}
      CORRALON_CUIT: ${CORRALON_CUIT:?CORRALON_CUIT es obligatorio}
      CORRALON_DIRECCION: ${CORRALON_DIRECCION:?CORRALON_DIRECCION es obligatorio}
      CORRALON_TELEFONO: ${CORRALON_TELEFONO:?CORRALON_TELEFONO es obligatorio}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME es obligatorio}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD es obligatorio}

  ms-gateway:
    ports: !reset []
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}

  prometheus:
    ports: !reset []

  grafana:
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER es obligatorio}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD es obligatorio}
