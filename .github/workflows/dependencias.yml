name: Dependencias

# Revision de vulnerabilidades conocidas en las dependencias (R2.14).
# - npm audit: falla si hay vulnerabilidades altas o criticas en las dependencias de produccion del frontend.
# - OWASP Dependency-Check: genera el reporte de los modulos Maven. Es informativo (no falla el flujo):
#   la base de datos de vulnerabilidades (NVD) cambia todos los dias y un hallazgo nuevo no debe
#   bloquear un cambio que no toco las dependencias. Se revisa el reporte publicado como artefacto.
#   Requiere el secret NVD_API_KEY; sin el, el job lo avisa y no analiza.
# Corre cada lunes, a pedido, y cuando un pull request cambia un pom.xml o el package.json.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/pom.xml'
      - 'frontend/ui/package.json'
      - 'frontend/ui/package-lock.json'
      - '.github/workflows/dependencias.yml'

permissions:
  contents: read

concurrency:
  group: dependencias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/ui/package-lock.json
      - run: npm ci
      - name: Reporte completo (incluye dependencias de desarrollo)
        run: npm audit --json > npm-audit.json || true
      - name: Falla con vulnerabilidades altas o criticas en produccion
        run: npm audit --omit=dev --audit-level=high
      - name: Publicar reporte de npm audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: frontend/ui/npm-audit.json

  owasp-dependency-check:
    name: OWASP Dependency-Check (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      # Sin clave la API de la NVD limita las peticiones y la descarga de la base falla o queda a medias
      # (probado: reintentos agotados y base corrupta). Por eso el analisis solo corre con la clave.
      # Se pide gratis en https://nvd.nist.gov/developers/request-an-api-key y se guarda como secret NVD_API_KEY.
      - name: Comprobar NVD_API_KEY
        id: clave
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=OWASP Dependency-Check omitido::Falta el secret NVD_API_KEY (gratis en nvd.nist.gov). Sin la clave la NVD limita las descargas y el analisis no es confiable."
          fi
      - uses: actions/checkout@v4
        if: steps.clave.outputs.disponible == 'true'
      - uses: actions/setup-java@v4
        if: steps.clave.outputs.disponible == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # La clave de cache lleva la version del plugin: una base de otra version no se reutiliza.
      - name: Restaurar la base de vulnerabilidades
        if: steps.clave.outputs.disponible == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-12.2.0-${{ github.run_id }}
          restore-keys: owasp-nvd-12.2.0-
      - name: Dependency-Check
        if: steps.clave.outputs.disponible == 'true'
        run: |
          mvn -B -q -DskipTests install -pl :dan-common
          mvn -B org.owasp:dependency-check-maven:12.2.0:aggregate -Dformat=ALL -DfailBuildOnCVSS=11 -DnvdApiKey="$NVD_API_KEY" -DossindexAnalyzerEnabled=false
      - name: Guardar la base de vulnerabilidades
        if: success() && steps.clave.outputs.disponible == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-12.2.0-${{ github.run_id }}
      - name: Publicar reporte de Dependency-Check
        if: always() && steps.clave.outputs.disponible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: target/dependency-check-report.*
          if-no-files-found: warn
