name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Docker esta disponible en ubuntu-latest: los tests con Testcontainers corren sin omitirse.
      - name: mvn verify (tests + umbral JaCoCo 80%)
        run: mvn -B verify
      - name: Fallar si hay tests omitidos
        run: bash ops/check-no-skipped-tests.sh .
      - name: Publicar reportes de Surefire y JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco*/
          if-no-files-found: warn

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Tests unitarios y de componente (Vitest)
        run: npm test
      - run: npm run build

  infra:
    name: Infra (compose, gitleaks, hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: docker compose config (valida los tres compose con .env.example)
        run: |
          cp .env.example .env
          docker network create backend-net || true
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.frontend.yml config -q
      - name: Build de las imagenes de backend (contexto = raiz del repo)
        run: |
          for m in dan-gateway ms-clientes ms-productos ms-pedidos; do
            docker build -f backend/$m/Dockerfile -t vigadesk-$m:ci .
          done
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: hadolint
        run: |
          for f in backend/*/Dockerfile frontend/ui/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$f"
          done

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/ui/package-lock.json
      - name: Configurar .env con credenciales de prueba
        run: |
          cp .env.example .env
          # .env.example trae marcadores; el secreto JWT necesita al menos 32 bytes
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          # El administrador inicial lo crea ms-clientes al arrancar con la base vacia (overlay ops/docker-compose.e2e.yml).
          sed -i 's/^BOOTSTRAP_ADMIN_EMAIL=.*/BOOTSTRAP_ADMIN_EMAIL=e2e-admin@example.com/' .env
          sed -i 's/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD=e2e-clave-de-prueba-123/' .env
      - name: Levantar el sistema (backend y frontend)
        run: |
          docker network create backend-net
          docker compose -f docker-compose.yml -f ops/docker-compose.e2e.yml up -d --build
          docker compose -f docker-compose.frontend.yml up -d --build
      - name: Esperar a que responda el login
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/usuarios/login               -H 'Content-Type: application/json' -d '{"email":"e2e-admin@example.com","password":"e2e-clave-de-prueba-123"}' || true)
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=80
          exit 1
      - name: Prueba de humo de observabilidad (targets de Prometheus y Actuator no expuesto)
        run: bash ops/smoke-observabilidad.sh
      - name: Instalar dependencias y navegador
        working-directory: frontend/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pruebas end to end
        working-directory: frontend/ui
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: e2e-clave-de-prueba-123
        run: npm run test:e2e
      - name: Publicar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/ui/playwright-report
            frontend/ui/test-results
          if-no-files-found: ignore
      - name: Logs del sistema si fallo
        if: failure()
        run: docker compose logs --tail=200
