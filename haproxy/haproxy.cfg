# ==== CONFIGURACIÓN GLOBAL ====
global
    log stdout format raw local0

# ==== VALORES POR DEFECTO ====
defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 50s
    timeout server 50s

# ==== FRONTEND: PUERTO 80 ====
# Enruta según el path de la URL
frontend http_in
    bind *:80

    acl is_api path_beg /api/       # Las rutas /api/* van al gateway
    use_backend gateway_backend if is_api
    default_backend next_frontend    # Todo lo demás va al frontend

# ==== BACKEND: FRONTEND (Next.js) ====
backend next_frontend
    option httpchk GET /
    server frontend-ui frontend-ui:3000 check

# ==== BACKEND: GATEWAY (Spring Cloud Gateway) ====
backend gateway_backend
    option httpchk GET /actuator/health
    server gateway ms-gateway:8080 check
