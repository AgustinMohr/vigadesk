services:

  ms-gateway:
    image: ms-gateway:latest
    container_name: ms-gateway
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
    ports:
      - "3080:8080"
    networks:
      - backend-net

networks:
  backend-net:
    external: true
