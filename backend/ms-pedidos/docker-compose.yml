# Compose de desarrollo para ms-pedidos.
# Requiere variables: docker compose --env-file ../../.env up -d
services:
  mongo-db:
    image: mongo:8.3
    container_name: mongo-db
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD requerido}
    networks:
      - pedidos-net

  ms-pedidos:
    image: ms-pedidos:latest
    container_name: ms-pedidos
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATA_MONGODB_HOST: mongo-db
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: pedidosdb
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD requerido}
      SPRING_DATA_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD requerido}@mongo-db:27017/pedidosdb?authSource=admin
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
    ports:
      - "127.0.0.1:6280:8080"
    depends_on:
      - mongo-db
    networks:
      - pedidos-net
      - backend-net

networks:
  backend-net:
    external: true
  pedidos-net:
    driver: bridge

volumes:
  mongo-data:
