spring.application.name=gateway-service

# ==== RUTAS DEL GATEWAY ====
# Cada ruta usa lb:// (load-balanced via Eureka) y RewritePath para quitar el prefijo

# /clientes/*, /api/obras/* y /api/usuarios/* → ms-clientes
spring.cloud.gateway.routes[0].id=clientes
spring.cloud.gateway.routes[0].uri=lb://ms-clientes
spring.cloud.gateway.routes[0].predicates[0]=Path=/clientes/**,/api/clientes/**,/api/obras/**,/api/usuarios/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=^/clientes/?(?<resto>.*), /$\{resto}

# /productos/* → ms-productos
spring.cloud.gateway.routes[1].id=productos
spring.cloud.gateway.routes[1].uri=lb://ms-productos
spring.cloud.gateway.routes[1].predicates[0]=Path=/productos/**,/api/productos/**,/api/categorias/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=^/productos/?(?<resto>.*), /$\{resto}

# /pedidos/* → ms-pedidos (nombre registrado en Eureka)
spring.cloud.gateway.routes[2].id=pedidos
spring.cloud.gateway.routes[2].uri=lb://ms-pedidos
spring.cloud.gateway.routes[2].predicates[0]=Path=/pedidos/**,/api/pedidos/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=^/pedidos/?(?<resto>.*), /$\{resto}

# ==== LOGGING ====
logging.level.org.springframework.cloud.gateway: INFO
logging.level.reactor.netty: INFO

# ==== COMPRESIÓN GZIP ====
spring.cloud.gateway.compression.enabled=true

# ==== MÉTRICAS (Prometheus + Actuator) ====
management.endpoint.metrics.enabled=true
# Actuator en un puerto de gestion aparte: no se publica al host ni lo enruta HAProxy ni el gateway.
# Solo es alcanzable dentro de backend-net (Prometheus y los HEALTHCHECK de Docker).
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.web.server.request.autotime.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# ==== EUREKA (Service Discovery) ====
eureka.client.serviceUrl.defaultZone=${SPRING_EUREKA_DEFAULT_ZONE}
eureka.client.initialInstanceInfoReplicationIntervalSeconds=5
eureka.client.registryFetchIntervalSeconds=5
eureka.instance.leaseRenewalIntervalInSeconds=5
eureka.instance.leaseExpirationDurationInSeconds=5

# ==== JWT (verificacion de tokens) ====
# Mismo secreto que ms-clientes (el que firma los tokens)
jwt.secret=${JWT_SECRET}

# El banner no es JSON: ensuciaria los logs estructurados
spring.main.banner-mode=off
