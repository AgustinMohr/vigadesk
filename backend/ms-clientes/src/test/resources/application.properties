# Perfil de test por defecto: H2 en memoria (rapido, sin infraestructura externa)
# Base H2 propia de cada contexto de Spring: no se comparten datos entre contextos que corren en la misma JVM
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# No registrarse en Eureka durante los tests
eureka.client.enabled=false

# Secreto de prueba (debe tener al menos 32 caracteres para HS256)
jwt.secret=test-secret-para-tests-de-vigadesk-1234567890
