spring.application.name=ms-clientes

# ==== BASE DE DATOS (MySQL) ====
# Credenciales y URL vía variables de entorno (definidas en docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# ==== MIGRACIONES (Flyway) ====
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

# ==== EUREKA (Service Discovery) ====
eureka.client.serviceUrl.defaultZone=${SPRING_EUREKA_DEFAULT_ZONE}
eureka.client.initialInstanceInfoReplicationIntervalSeconds=5
eureka.client.registryFetchIntervalSeconds=5
eureka.instance.leaseRenewalIntervalInSeconds=5
eureka.instance.leaseExpirationDurationInSeconds=5
eureka.instance.prefer-ip-address=true

# ==== MÉTRICAS (Prometheus + Actuator) ====
management.endpoint.metrics.enabled=true
# Actuator en un puerto de gestion aparte: no se publica al host ni lo enruta HAProxy ni el gateway.
# Solo es alcanzable dentro de backend-net (Prometheus y los HEALTHCHECK de Docker).
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.web.server.request.autotime.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# ==== JWT (firma de tokens) ====
# El secreto se comparte con dan-gateway (misma clave en ambos servicios)
jwt.secret=${JWT_SECRET}
# Tiempo de expiración del token en segundos (2 horas)
jwt.expiration=7200 

# ==== CLIENTES ====
# Valor por defecto del máximo descubierto si no se informa al crear el cliente
cliente.maximo-descubierto.default=${CLIENTE_MAXIMO_DESCUBIERTO_DEFAULT:10000}

# ==== ARRANQUE ====
# Datos de ejemplo (clientes, obras y usuarios de prueba). Solo desarrollo.
app.seed.enabled=${APP_SEED_ENABLED:false}
# Primer administrador: se crea solo si la base no tiene usuarios.
# En produccion BOOTSTRAP_ADMIN_REQUIRED=true hace fallar el arranque si faltan.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.required=${BOOTSTRAP_ADMIN_REQUIRED:false}

# El banner no es JSON: ensuciaria los logs estructurados
spring.main.banner-mode=off
