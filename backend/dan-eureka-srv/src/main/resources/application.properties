# Puerto y hostname del servidor Eureka (vía variables de entorno)
server.port=${SPRING_EUREKA_PORT:8761}
eureka.instance.hostname=${SPRING_EUREKA_HOST_NAME}

# Eureka no se registra a sí mismo (es el servidor, no un cliente)
eureka.client.registerWithEureka=false
eureka.client.fetchRegistry=false

# URL donde los clientes se registran (se pasa a los microservicios)
eureka.client.serviceUrl.defaultZone=${SPRING_EUREKA_DEFAULT_ZONE}

# Tiempo de espera cuando el registro está vacío al arrancar
eureka.server.waitTimeInMsWhenSyncEmpty=0
eureka.server.response-cache-update-interval-ms=5000