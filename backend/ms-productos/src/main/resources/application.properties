spring.application.name=ms-productos

# ==== BASE DE DATOS (PostgreSQL) ====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-productos.sql

# ==== RABBITMQ (Broker de mensajes) ====
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Habilitar reintentos en el listener de RabbitMQ
spring.rabbitmq.listener.simple.retry.enabled=true

# Número máximo de intentos antes de desistir
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Tiempo de espera inicial entre reintentos (1 segundo)
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms

# CLAVE: Si falla tras los reintentos o lanza una excepción, NO vuelve a encolar el mensaje
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==== EUREKA (Service Discovery) ====
eureka.client.serviceUrl.defaultZone=${SPRING_EUREKA_DEFAULT_ZONE}
eureka.client.initialInstanceInfoReplicationIntervalSeconds=5
eureka.client.registryFetchIntervalSeconds=5
eureka.instance.leaseRenewalIntervalInSeconds=5
eureka.instance.leaseExpirationDurationInSeconds=5
eureka.instance.prefer-ip-address=true

# ==== MÉTRICAS (Prometheus + Actuator) ====
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

logging.level.org.springframework.web.client.RestTemplate=DEBUG