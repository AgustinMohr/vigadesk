name: vigadesk

services:
  # ==== SERVICE DISCOVERY (Eureka Server) ====
  ms-eureka:
    image: ms-eureka:latest
    container_name: ms-eureka
    restart: on-failure
    build:
      context: ./backend/dan-eureka-srv
      dockerfile: Dockerfile
    environment:
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      SPRING_EUREKA_HOST_NAME: ms-eureka
      SPRING_EUREKA_PORT: 8761
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m" # Eureka es liviano, 128MB le sobra
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - backend-net

  # ==== BASE DE DATOS MySQL (ms-clientes) ====
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M # Limita la memoria interna de MySQL
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requerido}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dandb}
      MYSQL_USER: ${MYSQL_USER:-danuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requerido}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ==== MICROSERVICIO CLIENTES ====
  ms-clientes:
    image: ms-clientes:latest
    container_name: ms-clientes
    restart: on-failure
    build:
      context: ./backend/ms-clientes
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-dandb}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-danuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requerido}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      # Desarrollo: carga clientes, obras y usuarios de ejemplo si la base esta vacia.
      # El overlay docker-compose.prod.yml lo desactiva.
      APP_SEED_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:6080:8080"
    depends_on:
      ms-eureka:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - backend-net

  # ==== BASE DE DATOS PostgreSQL (ms-productos) ====
  pg-dan:
    image: postgres:17
    container_name: pg-dan-db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:-pg-dan}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==== MICROSERVICIO PRODUCTOS ====
  ms-productos:
    image: ms-productos:latest
    container_name: ms-productos
    restart: on-failure
    build:
      context: ./backend/ms-productos
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg-dan:5432/${POSTGRES_DB:-pg-dan}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pguser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_DATA_LOCATIONS: classpath:test-data-productos.sql
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:6180:8080"
    depends_on:
      ms-eureka:
        condition: service_started
      pg-dan:
        condition: service_healthy
    networks:
      - backend-net

  # ==== BASE DE DATOS MongoDB (ms-pedidos) ====
  mongo-db:
    image: mongo:8.3
    container_name: mongo-db
    restart: always
    command: --wiredTigerCacheSizeGB 0.25 # Limita la caché de memoria de MongoDB
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./backend/ms-pedidos/src/main/resources/mongo-init-pedidos.js:/docker-entrypoint-initdb.d/mongo-init-pedidos.js
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD requerido}
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 30s

  # ==== MICROSERVICIO PEDIDOS ====
  ms-pedidos:
    image: ms-pedidos:latest
    container_name: ms-pedidos
    restart: on-failure
    build:
      context: ./backend/ms-pedidos
      dockerfile: Dockerfile
    environment:
      SPRING_DATA_MONGODB_HOST: mongo-db
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: pedidosdb
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD requerido}
      SPRING_DATA_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD requerido}@mongo-db:27017/pedidosdb?authSource=admin
      CORRALON_NOMBRE: ${CORRALON_NOMBRE:-Corralon de Materiales}
      CORRALON_CUIT: ${CORRALON_CUIT:-30-00000000-0}
      CORRALON_DIRECCION: ${CORRALON_DIRECCION:-Direccion del corralon}
      CORRALON_TELEFONO: ${CORRALON_TELEFONO:-000-000-0000}
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:6280:8080"
    depends_on:
      ms-eureka:
        condition: service_started
      mongo-db:
        condition: service_healthy
    networks:
      - backend-net

  # ==== API GATEWAY (Spring Cloud Gateway) ====
  ms-gateway:
    image: ms-gateway:latest
    container_name: ms-gateway
    restart: on-failure
    build:
      context: ./backend/dan-gateway
      dockerfile: Dockerfile
    environment:
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:3080:8080"
    depends_on:
      - ms-eureka
      - ms-clientes
      - ms-productos
      - ms-pedidos
    networks:
      - backend-net

  # ==== PROMETHEUS (recolección de métricas de actuator) ====
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: on-failure
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - ms-clientes
      - ms-productos
      - ms-pedidos
      - ms-gateway
    networks:
      - backend-net

  # ==== GRAFANA (visualización de métricas) ====
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: on-failure
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD requerido}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend-net

networks:
  backend-net:
    external: true

volumes:
  mysql-data:
  pg-data:
  mongo-data:
  grafana-data:
