# ==== BROKER DE MENSAJES ====
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: "secret_cookie_value"
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==== SERVICE DISCOVERY (Eureka Server) ====
  ms-eureka:
    image: ms-eureka:latest
    container_name: ms-eureka
    restart: on-failure
    build:
      context: ./dan-eureka-srv
      dockerfile: Dockerfile
    environment:
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      SPRING_EUREKA_HOST_NAME: ms-eureka
      SPRING_EUREKA_PORT: 8761
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m" # Eureka es liviano, 128MB le sobra
    deploy:
      resources:
        limits:
          memory: 200M
    ports:
      - "8761:8761"
    networks:
      - backend-net

  # ==== BASE DE DATOS MySQL (ms-clientes) ====
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M # Limita la memoria interna de MySQL
    environment:
      MYSQL_ROOT_PASSWORD: danrootpassword
      MYSQL_DATABASE: dandb
      MYSQL_USER: danuser
      MYSQL_PASSWORD: danpassword
    deploy:
      resources:
        limits:
          memory: 400M
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u danuser -pdanpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ==== MICROSERVICIO CLIENTES ====
  ms-clientes:
    image: ms-clientes:latest
    container_name: ms-clientes
    restart: on-failure
    build:
      context: ./ms-clientes
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/dandb
      SPRING_DATASOURCE_USERNAME: danuser
      SPRING_DATASOURCE_PASSWORD: danpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    deploy:
      resources:
        limits:
          memory: 300M
    ports:
      - "6080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      ms-eureka:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - backend-net

  # ==== BASE DE DATOS PostgreSQL (ms-productos) ====
  pg-dan:
    image: postgres:17
    container_name: pg-dan-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: pg-dan
    deploy:
      resources:
        limits:
          memory: 300M
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pg-dan"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==== MICROSERVICIO PRODUCTOS ====
  ms-productos:
    image: ms-productos:latest
    container_name: ms-productos
    restart: on-failure
    build:
      context: ./ms-productos
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg-dan-db:5432/pg-dan
      SPRING_DATASOURCE_USERNAME: pguser
      SPRING_DATASOURCE_PASSWORD: pgpassword
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_SQL_INIT_DATA_LOCATIONS: classpath:test-data-productos.sql
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    deploy:
      resources:
        limits:
          memory: 300M
    ports:
      - "6180:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      ms-eureka:
        condition: service_started
      pg-dan:
        condition: service_healthy
    networks:
      - backend-net

  # ==== BASE DE DATOS MongoDB (ms-pedidos) ====
  mongo-db:
    image: mongo
    container_name: mongo-db
    restart: always
    command: --wiredTigerCacheSizeGB 0.25 # Limita la caché de memoria de MongoDB
    ports:
      - "27017:27017"
    deploy:
      resources:
        limits:
          memory: 350M
    volumes:
      - mongo-data:/data/db
      - ./ms-pedidos/src/main/resources/mongo-init-pedidos.js:/docker-entrypoint-initdb.d/mongo-init-pedidos.js
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dan
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==== MICROSERVICIO PEDIDOS ====
  ms-pedidos:
    image: ms-pedidos:latest
    container_name: ms-pedidos
    restart: on-failure
    build:
      context: ./ms-pedidos
      dockerfile: Dockerfile
    environment:
      SPRING_DATA_MONGODB_HOST: mongo-db
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: pedidosdb
      SPRING_DATA_MONGODB_USERNAME: root
      SPRING_DATA_MONGODB_PASSWORD: dan
      SPRING_DATA_MONGODB_URL: mongodb://root:dan@mongo-db:27017/pedidosdb?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    deploy:
      resources:
        limits:
          memory: 300M
    ports:
      - "6280:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      ms-eureka:
        condition: service_started
      mongo-db:
        condition: service_healthy
    networks:
      - backend-net

  # ==== API GATEWAY (Spring Cloud Gateway) ====
  ms-gateway:
    image: ms-gateway:latest
    container_name: ms-gateway
    restart: on-failure
    build:
      context: ./dan-gateway
      dockerfile: Dockerfile
    environment:
      SPRING_EUREKA_DEFAULT_ZONE: http://ms-eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    deploy:
      resources:
        limits:
          memory: 300M
    ports:
      - "3080:8080"
    depends_on:
      - ms-eureka
      - ms-clientes
      - ms-productos
      - ms-pedidos
    networks:
      - backend-net

